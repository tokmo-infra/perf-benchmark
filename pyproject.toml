[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "perf-benchmark"
version = "0.8.0"
description = "Streaming eight-stage LLM performance benchmark kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.1",
    "datasets>=4.0",
    "duckdb>=1.1",
    "filelock>=3.18",
    "multiprocess>=0.70.16",
    "numpy>=1.26",
    "orjson>=3.10",
    "openpyxl>=3.1,<4",
    "platformdirs>=4.3",
    "prometheus-client>=0.21,<1",
    "pyarrow>=17",
    "pyrefly>=0.60.0",
    "PyYAML>=6",
    "rich>=13.9",
    "transformers>=4.57,<5",
    "tokenizers==0.22.2",
    "jinja2>=3.1.6",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6,<8", "pytest-asyncio>=0.23", "psutil>=6,<8"]
observation = [
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "psutil>=6,<8",
]
production-traces = ["scipy>=1.14,<2", "pillow>=11,<12"]

[dependency-groups]
dev = [{include-group = "gpu-deploy"}, "pytest>=8", "pytest-cov>=6,<8", "pytest-asyncio>=0.23", "ruff>=0.12", "psutil>=6,<8"]
gpu-deploy = [
    "paramiko>=4,<5",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "perf_benchmark/**/*.rs" }, { file = "perf_benchmark/**/Cargo.toml" }, { file = "perf_benchmark/Cargo.lock" }, { file = "perf_benchmark/rust-toolchain.toml" }]
default-groups = ["dev"]

[project.scripts]
perf-benchmark = "perf_benchmark.app.main:console_main"

[tool.maturin]
manifest-path = "perf_benchmark/plugins/executor/rust_bindings/Cargo.toml"
python-source = "."
module-name = "perf_benchmark._native"
features = ["extension-module"]
locked = true
exclude = [{ path = "perf_benchmark/**/*.rs", format = "wheel" }, { path = "perf_benchmark/**/Cargo.toml", format = "wheel" }, { path = "perf_benchmark/Cargo.lock", format = "wheel" }, { path = "perf_benchmark/rust-toolchain.toml", format = "wheel" }, { path = "perf_benchmark/target/**", format = "wheel" }]
include = ["perf_benchmark/app/workbench/**/*", "perf_benchmark/plugins/exporter/html/*.html", { path = "perf_benchmark/rust-toolchain.toml", format = "sdist" }]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "performance_guardrail: opt-in client saturation acceptance test",
    "real_e2e: requires an explicitly configured OpenAI-compatible service and local fixtures",
    "real_dataset: requires the local GSM8K, OpenQA, and SWE-Bench fixtures",
    "real_dataset_performance: opt-in SWE normalization performance acceptance",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
