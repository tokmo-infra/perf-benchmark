[workspace]
resolver = "2"
members = ["runtime/http/rusthttp", "plugins/executor/*/rust", "plugins/executor/rust_bindings", "corpus/rust"]

[workspace.package]
edition = "2021"
rust-version = "1.87"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures-util = "0.3"
pyo3 = { version = "=0.29.2" }
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }
nix = { version = "0.31", features = ["time"] }
windows-sys = { version = "0.61", features = ["Win32_System_Performance"] }

hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-proxy"] }
http = "1"
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
url = "2"
base64 = "0.22"
percent-encoding = "2"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }

[profile.release]
lto = "thin"
