apiVersion: 1
datasources:
  - name: Benchmark results
    uid: benchmark-results
    type: yesoreyeram-infinity-datasource
    access: proxy
    jsonData:
      allowedHosts:
        - http://results:8088
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      timeInterval: 2s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: false
        filterBySpanID: false
      nodeGraph:
        enabled: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: 'trace_id[=" :]+([0-9a-f]{32})'
          datasourceUid: tempo
          url: '$${__value.raw}'
  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://127.0.0.1:4040
