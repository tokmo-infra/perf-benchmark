map $http_upgrade $workbench_connection {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $workbench_scheme {
    default $scheme;
    http http;
    https https;
}

server {
    listen 8088;
    server_name _;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $workbench_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /grafana {
        return 308 /grafana/;
    }

    location /grafana/ {
        set $grafana http://observation:3000;
        proxy_pass $grafana$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $workbench_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $workbench_connection;
        proxy_read_timeout 3600s;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location / {
        set $results http://results:8088;
        proxy_pass $results$request_uri;
    }
}
