# Edit the inference target, model and a NEW result path before each run.
name: remote-gpu-benchmark
logging:
  level: INFO
  stream: stderr
pipeline:
  loader:
    plugin: hf-datasets
    settings:
      dataset: json
      data_files:
      - /work/data/requests.jsonl
      split: train
      cache_dir: /work/cache/datasets
      batch_rows: 128
  normalization:
    plugin: openai-messages
    settings:
      tokenizer_path: /work/tokenizer
  selector:
    plugin: all
  executor:
    plugin: openai-chat
    settings:
      base_url: http://gpu-server.internal:8000
      model: model-a
      stream: true
      timeout_seconds: 60
      max_tokens: 50
  scheduler:
    plugin: single-turn-closed-loop
    settings:
      max_concurrency: 1
      stop:
        session_count: 2
      on_exhausted: error
  metrics:
    plugin: standard
    settings:
      steady:
        min_ratio: 0.9
        min_duration_s: 1.0
  saver:
    plugin: sqlite
    settings:
      path: /work/results/run-001.db
  exporter: {}
observation:
  enabled: true
  trace_mode: benchmark
  host: 0.0.0.0
  port: 0
  discovery_dir: /work/targets
  advertise_host: perf-benchmark
  poll_seconds: 2
  page_size: 500
  sample_rate: 0.01
  slow_seconds: 10
  slow_spans_per_second: 20
  otlp_endpoint: http://observation:4318/v1/traces
  targets:
    engines:
    - address: gpu-server.internal:8000
      service_name: inference
      engine: vllm
      model: model-a
    gpu:
    - address: gpu-server.internal:9400
      service_name: dcgm
    profiles: []
